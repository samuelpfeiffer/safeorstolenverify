    <!-- LovableHTML page-ready detection -->
    <script>
      // LovableHTML uses this signal to know when the page is fully rendered
      // and safe to snapshot for search engine / AI crawler serving.
      window.prerenderReady = false;
      
      document.addEventListener('DOMContentLoaded', function() {
        var checkReady = setInterval(function() {
          var root = document.getElementById('root');
          // Wait for React to render AND helmet to inject ALL critical SEO meta tags
          var hasContent = root && root.children.length > 0 && !root.querySelector('.loading');
          var hasTitle = document.querySelector('title') && document.title.length > 0;
          var hasCanonical = document.querySelector('link[rel="canonical"]');
          var hasRobots = document.querySelector('meta[name="robots"]');
          var hasDescription = document.querySelector('meta[name="description"]');
          
          // CRITICAL: Also verify the canonical is NOT the generic homepage one
          // (unless we're actually on the homepage). This prevents LovableHTML
          // from snapshotting stale homepage meta on other pages.
          var isHomepage = window.location.pathname === '/' || window.location.pathname === '';
          var canonicalEl = document.querySelector('link[rel="canonical"]');
          var canonicalIsCorrect = isHomepage || (canonicalEl && canonicalEl.getAttribute('href') && !canonicalEl.getAttribute('href').endsWith('.com/'));
          
          if (hasContent && hasTitle && hasCanonical && hasRobots && hasDescription && canonicalIsCorrect) {
            window.prerenderReady = true;
            clearInterval(checkReady);
          }
        }, 100);
        
        // Safety timeout - increased to 12s to allow heavy pages (firearms-check: 5000+ words) to hydrate
        setTimeout(function() {
          window.prerenderReady = true;
          clearInterval(checkReady);
        }, 12000);
      });
