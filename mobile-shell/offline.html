<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SafeOrStolen - No connection</title>
<style>
  :root { color-scheme: dark; }
  html, body { margin: 0; height: 100%; background: #0d0d0d; color: #f5f5f5;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  main { min-height: 100%; display: flex; flex-direction: column; align-items: center;
    justify-content: center; padding: 24px; padding-top: max(24px, env(safe-area-inset-top));
    text-align: center; box-sizing: border-box; }
  img { width: 88px; height: 88px; border-radius: 20px; margin-bottom: 24px; }
  h1 { font-size: 22px; margin: 0 0 8px; }
  p { font-size: 16px; line-height: 1.5; color: #b3b3b3; max-width: 320px; margin: 0 0 28px; }
  button { font: inherit; font-weight: 600; font-size: 16px; color: #fff; background: #FF6B35;
    border: 0; border-radius: 12px; padding: 14px 32px; min-width: 200px; }
</style>
</head>
<body>
<main>
  <img src="logo.png" alt="SafeOrStolen">
  <h1>You're offline</h1>
  <p>SafeOrStolen needs an internet connection to check theft reports. Connect to Wi-Fi or mobile data and try again.</p>
  <button type="button" onclick="location.href='https://safeorstolen.com/'">Try again</button>
</main>
</body>
</html>
