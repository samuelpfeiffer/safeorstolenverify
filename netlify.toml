# ============================================
# SafeOrStolen Netlify Configuration
# Prerender.io Integration for SEO & AI Crawlers
# ============================================

[build]
  publish = "dist"
  command = "npm run build"

# ============================================
# Prerender.io Plugin for Dynamic Rendering
# Serves pre-rendered HTML to search engines and AI bots
# ============================================
[[plugins]]
  package = "@prerender/netlify-plugin"

[plugins.inputs]
  prerenderToken = "iiMthWrIIiQhunohL2U5"
  prerenderServiceUrl = "https://service.prerender.io/"

# ============================================
# Build Environment
# ============================================
[build.environment]
  NODE_VERSION = "18"
  NPM_VERSION = "9"

# ============================================
# Headers
# ============================================
[[headers]]
  for = "/*"
  [headers.values]
    X-Prerender-Token = "iiMthWrIIiQhunohL2U5"
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(self), interest-cohort=()"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' https://js.stripe.com https://checkout.stripe.com https://www.googletagmanager.com https://www.google-analytics.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: https:; connect-src 'self' https: wss: https://*.supabase.co; frame-src 'self' https://js.stripe.com https://checkout.stripe.com; object-src 'none'; base-uri 'self'; form-action 'self' https://checkout.stripe.com; frame-ancestors 'self'; upgrade-insecure-requests"

# ============================================
# Redirects for SPA
# ============================================
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
  conditions = {Role = ["admin", "user"]}

# Note: Primary redirects are handled in public/_redirects
